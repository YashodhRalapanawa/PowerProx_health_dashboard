name: powerprox-monitoring

services:
  backend:
    image: powerprox-backend:local
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    image: powerprox-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
