name: powerprox-server

services:
  backend:
    image: powerprox-backend:server
    build:
      context: ./backend
    env_file:
      - ./backend/.env.server
    environment:
      PORT: "5000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: powerprox-frontend:server
    build:
      context: ./frontend
      dockerfile: Dockerfile.server
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:8095:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
